[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "django-datatables-listview"
version = "0.2.0"
description = "A Datatables Django server-side scripting implementation"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Milton Lenis" },
    { name = "Jhon F. Mena" }
]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3"
]
dependencies = [
    "django==5.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["datatables_listview*"]

[tool.setuptools.package-data]
"*" = [
    "static/**/*",
    "templates/**/*",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "datatables_listview.tests.testsettings"